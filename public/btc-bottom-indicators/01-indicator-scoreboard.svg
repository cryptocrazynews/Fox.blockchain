  <!-- verdict bar -->
  <rect x="60" y="664" width="1080" height="128" rx="16" fill="#eef6ec" stroke="#9bbf8a" stroke-width="2"/>
  <text x="84" y="702" font-size="24" font-weight="700" fill="#4f7a3a">綜合評價：價值累積區，分批布局優於一次重壓</text>
  <text x="84" y="736" font-size="18" fill="#2b2320">估值與鏈上成本面普遍便宜、進入歷史累積區；但資金費率仍正、ETF 短期流出、情緒已回中性，</text>
  <text x="84" y="762" font-size="18" fill="#2b2320">代表最恐慌的一刻可能剛過、趨勢尚未確認轉多。這裡是「便宜區」，不是「保證最低點」。</text>
  <text x="84" y="786" font-size="16" fill="#8a7a6d">做法：定期定額布局、只用閒錢、不上槓桿、長期部位自我保管。</text>

  <text x="60" y="836" font-size="15" fill="#a89a8d">小狐狸區塊鏈  ·  本文為知識分享，不構成投資建議，數值以各鏈上平台即時資料為準</text>
