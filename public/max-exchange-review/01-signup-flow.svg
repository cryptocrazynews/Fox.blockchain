<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8f1"/>
      <stop offset="1" stop-color="#fdeede"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a35e"/>
      <stop offset="1" stop-color="#e8722a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="80" y="90" font-size="46" font-weight="700" fill="#2b2320">MAX 開戶到入金，四步走完</text>
  <text x="80" y="132" font-size="24" fill="#8a7a6d">最慢的是等待審核，開戶當天就把該送的一起送出</text>

  <!-- main line -->
  <rect x="150" y="365" width="900" height="10" rx="5" fill="url(#line)"/>

  <!-- node 1 -->
  <circle cx="230" cy="370" r="16" fill="#e8722a" stroke="#fff" stroke-width="4"/>
  <rect x="120" y="200" width="230" height="130" rx="14" fill="#ffffff" stroke="#f2c9a3" stroke-width="2"/>
  <text x="235" y="240" font-size="26" font-weight="700" fill="#e8722a" text-anchor="middle">1 註冊</text>
  <text x="235" y="275" font-size="19" fill="#2b2320" text-anchor="middle">email 與手機驗證</text>
  <text x="235" y="303" font-size="16" fill="#8a7a6d" text-anchor="middle">幾分鐘就完成</text>

  <!-- node 2 -->
  <circle cx="500" cy="370" r="16" fill="#e8722a" stroke="#fff" stroke-width="4"/>
  <rect x="385" y="410" width="240" height="140" rx="14" fill="#ffffff" stroke="#f2c9a3" stroke-width="2"/>
  <text x="505" y="450" font-size="26" font-weight="700" fill="#e8722a" text-anchor="middle">2 KYC</text>
  <text x="505" y="485" font-size="18" fill="#2b2320" text-anchor="middle">身分證＋第二證件</text>
  <text x="505" y="513" font-size="16" fill="#8a7a6d" text-anchor="middle">L1 約 1~2 天，L2 約 3~5 天</text>

  <!-- node 3 -->
  <circle cx="770" cy="370" r="16" fill="#e8722a" stroke="#fff" stroke-width="4"/>
  <rect x="655" y="200" width="240" height="140" rx="14" fill="#ffffff" stroke="#f2c9a3" stroke-width="2"/>
  <text x="775" y="240" font-size="26" font-weight="700" fill="#e8722a" text-anchor="middle">3 綁銀行</text>
  <text x="775" y="275" font-size="18" fill="#2b2320" text-anchor="middle">平台匯 1 元驗證</text>
  <text x="775" y="303" font-size="16" fill="#8a7a6d" text-anchor="middle">約 3~5 個工作天</text>

  <!-- node 4 -->
  <circle cx="1000" cy="370" r="16" fill="#c85a1c" stroke="#fff" stroke-width="4"/>
  <rect x="890" y="410" width="245" height="140" rx="14" fill="#fff3e8" stroke="#e8a76a" stroke-width="2"/>
  <text x="1012" y="450" font-size="26" font-weight="700" fill="#c85a1c" text-anchor="middle">4 入金</text>
  <text x="1012" y="485" font-size="18" fill="#2b2320" text-anchor="middle">遠東商銀虛擬帳戶</text>
  <text x="1012" y="513" font-size="16" fill="#8a7a6d" text-anchor="middle">新戶每日上限 10 萬元</text>

  <text x="80" y="640" font-size="16" fill="#a89a8d">小狐狸區塊鏈  ·  流程與時程以 MAX 官方公告為準，實測於 2026 年 7 月</text>
</svg>
