  <text x="175" y="248" font-size="18" fill="#2b2320">8 家完成洗防登記之一，MaiCoin 經營</text>

  <!-- item 2 -->
  <rect x="610" y="165" width="510" height="115" rx="16" fill="#fff" stroke="#e8a76a" stroke-width="2"/>
