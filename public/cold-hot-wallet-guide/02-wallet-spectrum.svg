<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1200" height="675" fill="#fff8f1"/>
  <text x="80" y="82" font-size="46" font-weight="700" fill="#2b2320">保管光譜：你的幣放在哪？</text>
  <text x="80" y="122" font-size="22" fill="#8a7a6d">從「交給別人」到「完全自己保管」，依金額放對位置</text>

  <!-- gradient bar -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0d8c4"/>
      <stop offset="0.5" stop-color="#e8a76a"/>
      <stop offset="1" stop-color="#c85a1c"/>
    </linearGradient>
  </defs>
  <rect x="90" y="196" width="1020" height="18" rx="9" fill="url(#grad)"/>
  <text x="90" y="248" font-size="19" fill="#8a7a6d">最方便，最不是你的</text>
  <text x="1110" y="248" font-size="19" fill="#8a7a6d" text-anchor="end">最安全，完全自己保管</text>

  <!-- 3 stages -->
  <rect x="80" y="290" width="330" height="300" rx="18" fill="#fdeede" stroke="#e8c3a0" stroke-width="2"/>
  <circle cx="120" cy="340" r="16" fill="#e8a76a"/>
  <text x="150" y="348" font-size="26" font-weight="700" fill="#c85a1c">交易所託管</text>
  <text x="110" y="398" font-size="20" fill="#2b2320">幣記在交易所名下，</text>
  <text x="110" y="428" font-size="20" fill="#2b2320">你只有一個帳號。</text>
  <text x="110" y="472" font-size="20" fill="#2b2320">停機、被管制、被盜</text>
  <text x="110" y="502" font-size="20" fill="#2b2320">就可能被卡住。</text>
  <text x="110" y="552" font-size="21" font-weight="700" fill="#b0451a">控制權不在你手上</text>

  <rect x="435" y="290" width="330" height="300" rx="18" fill="#fff3e8" stroke="#e8a76a" stroke-width="2"/>
  <circle cx="475" cy="340" r="16" fill="#e8722a"/>
  <text x="505" y="348" font-size="26" font-weight="700" fill="#c85a1c">熱錢包</text>
  <text x="465" y="398" font-size="20" fill="#2b2320">私鑰在你手機或</text>
  <text x="465" y="428" font-size="20" fill="#2b2320">瀏覽器外掛裡。</text>
  <text x="465" y="472" font-size="20" fill="#2b2320">自己保管，但因為</text>
  <text x="465" y="502" font-size="20" fill="#2b2320">連網仍有風險。</text>
  <text x="465" y="552" font-size="21" font-weight="700" fill="#c85a1c">適合日常小額</text>

  <rect x="790" y="290" width="330" height="300" rx="18" fill="#fbe6dc" stroke="#d9743f" stroke-width="2"/>
  <circle cx="830" cy="340" r="16" fill="#c85a1c"/>
  <text x="860" y="348" font-size="26" font-weight="700" fill="#b0451a">冷錢包</text>
  <text x="820" y="398" font-size="20" fill="#2b2320">私鑰鎖在離線的</text>
  <text x="820" y="428" font-size="20" fill="#2b2320">硬體裝置裡。</text>
  <text x="820" y="472" font-size="20" fill="#2b2320">駭客碰不到鑰匙，</text>
  <text x="820" y="502" font-size="20" fill="#2b2320">安全性最高。</text>
  <text x="820" y="552" font-size="21" font-weight="700" fill="#c03d12">適合長期大額</text>

  <text x="80" y="644" font-size="16" fill="#a89a8d">小狐狸區塊鏈  ·  私鑰在誰手上，資產就在誰手上</text>
</svg>
