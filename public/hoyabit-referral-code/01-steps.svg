<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Noto Sans CJK TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8f1"/><stop offset="1" stop-color="#fdeede"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="60" y="88" font-size="44" font-weight="900" fill="#2b2320">HOYA BIT 推薦碼填寫 5 步驟</text>
  <text x="60" y="130" font-size="23" fill="#8a7a6d">邀請碼欄位標示「選填」，最容易漏掉的是第 2 步</text>
  <rect x="60" y="190" width="190" height="330" rx="20" fill="#ffffff" stroke="#f2c9a3" stroke-width="3"/>
  <circle cx="155" cy="245" r="32" fill="#e8722a"/>
  <text x="155" y="257" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
  <text x="155" y="325" font-size="30" font-weight="700" fill="#2b2320" text-anchor="middle">註冊帳號</text>
  <text x="155" y="380" font-size="20" fill="#8a7a6d" text-anchor="middle">官網或 App</text>
  <text x="155" y="415" font-size="20" fill="#8a7a6d" text-anchor="middle">輸入信箱與密碼</text>
  <text x="155" y="460" font-size="20" fill="#8a7a6d" text-anchor="middle"></text>
  <path d="M256 355 l16 0 m-7 -8 l8 8 l-8 8" stroke="#e8722a" stroke-width="3" fill="none"/>
  <rect x="280" y="190" width="190" height="330" rx="20" fill="#fff1e4" stroke="#e8722a" stroke-width="3"/>
  <circle cx="375" cy="245" r="32" fill="#e8722a"/>
  <text x="375" y="257" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
  <text x="375" y="325" font-size="30" font-weight="700" fill="#2b2320" text-anchor="middle">填邀請碼</text>
  <text x="375" y="380" font-size="20" fill="#8a7a6d" text-anchor="middle">手動輸入</text>
  <text x="375" y="420" font-size="28" font-weight="900" fill="#e8722a" text-anchor="middle">BdniStdb</text>
  <text x="375" y="460" font-size="20" fill="#8a7a6d" text-anchor="middle">大小寫要一致</text>
  <path d="M476 355 l16 0 m-7 -8 l8 8 l-8 8" stroke="#e8722a" stroke-width="3" fill="none"/>
  <rect x="500" y="190" width="190" height="330" rx="20" fill="#ffffff" stroke="#f2c9a3" stroke-width="3"/>
  <circle cx="595" cy="245" r="32" fill="#e8722a"/>
  <text x="595" y="257" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
  <text x="595" y="325" font-size="30" font-weight="700" fill="#2b2320" text-anchor="middle">身分驗證</text>
  <text x="595" y="380" font-size="20" fill="#8a7a6d" text-anchor="middle">上傳證件</text>
  <text x="595" y="415" font-size="20" fill="#8a7a6d" text-anchor="middle">臉部辨識</text>
  <text x="595" y="460" font-size="20" fill="#8a7a6d" text-anchor="middle">完成為 LV1</text>
  <path d="M696 355 l16 0 m-7 -8 l8 8 l-8 8" stroke="#e8722a" stroke-width="3" fill="none"/>
  <rect x="720" y="190" width="190" height="330" rx="20" fill="#ffffff" stroke="#f2c9a3" stroke-width="3"/>
  <circle cx="815" cy="245" r="32" fill="#e8722a"/>
  <text x="815" y="257" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
  <text x="815" y="325" font-size="30" font-weight="700" fill="#2b2320" text-anchor="middle">綁定銀行</text>
  <text x="815" y="380" font-size="20" fill="#8a7a6d" text-anchor="middle">同名帳戶</text>
  <text x="815" y="415" font-size="20" fill="#8a7a6d" text-anchor="middle">升級 LV2</text>
  <text x="815" y="460" font-size="20" fill="#8a7a6d" text-anchor="middle">才能用台幣</text>
  <path d="M916 355 l16 0 m-7 -8 l8 8 l-8 8" stroke="#e8722a" stroke-width="3" fill="none"/>
  <rect x="940" y="190" width="190" height="330" rx="20" fill="#ffffff" stroke="#f2c9a3" stroke-width="3"/>
  <circle cx="1035" cy="245" r="32" fill="#e8722a"/>
  <text x="1035" y="257" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1035" y="325" font-size="30" font-weight="700" fill="#2b2320" text-anchor="middle">入金閃兌</text>
  <text x="1035" y="380" font-size="20" fill="#8a7a6d" text-anchor="middle">台幣入金後</text>
  <text x="1035" y="415" font-size="20" fill="#8a7a6d" text-anchor="middle">選幣按確認</text>
  <text x="1035" y="460" font-size="20" fill="#8a7a6d" text-anchor="middle">FOK 立即成交</text>
  <rect x="60" y="550" width="1080" height="60" rx="14" fill="#ffffff" stroke="#f2c9a3" stroke-width="2"/>
  <text x="90" y="589" font-size="22" fill="#2b2320">提醒：官方未公開補填規則，按下註冊前先確認邀請碼欄位不是空的</text>
  <text x="1150" y="645" font-size="20" fill="#8a7a6d" text-anchor="end">小狐狸區塊鏈 fox-blockchain.com</text>
</svg>
