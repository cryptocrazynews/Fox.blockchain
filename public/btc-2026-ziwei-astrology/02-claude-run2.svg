<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1200" height="675" fill="#fff8f1"/>
  <text x="70" y="62" font-size="40" font-weight="700" fill="#2b2320">Claude 第二次：比特幣 2026 逐月漲跌</text>
  <text x="70" y="98" font-size="19" fill="#8a7a6d">紫微斗數命理趣味推演　·　農曆流月（附國曆區間）</text>

  <circle cx="80" cy="128" r="9" fill="#4f9d5b"/><text x="96" y="135" font-size="17" fill="#2b2320">偏多／漲</text>
  <circle cx="240" cy="128" r="9" fill="#d98a2b"/><text x="256" y="135" font-size="17" fill="#2b2320">震盪</text>
  <circle cx="360" cy="128" r="9" fill="#c0392b"/><text x="376" y="135" font-size="17" fill="#2b2320">回檔／風險</text>
  <circle cx="540" cy="128" r="9" fill="#8a7a6d"/><text x="556" y="135" font-size="17" fill="#2b2320">中性</text>

  <!-- LEFT -->
  <g>
    <rect x="70" y="160" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="70" y="160" width="8" height="66" rx="4" fill="#4f9d5b"/>
    <text x="98" y="189" font-size="19" font-weight="700" fill="#c85a1c">正月　2/17~3/18</text><text x="98" y="214" font-size="16" fill="#2b2320">開年最舒服，震盪走揚</text><text x="553" y="205" font-size="38" font-weight="700" fill="#4f9d5b" text-anchor="middle">↑</text>

    <rect x="70" y="234" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="70" y="234" width="8" height="66" rx="4" fill="#d98a2b"/>
    <text x="98" y="263" font-size="19" font-weight="700" fill="#c85a1c">二月　3/19~4/16</text><text x="98" y="288" font-size="16" fill="#2b2320">利多消息，急漲急跌</text><text x="553" y="279" font-size="38" font-weight="700" fill="#d98a2b" text-anchor="middle">↕</text>

    <rect x="70" y="308" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="70" y="308" width="8" height="66" rx="4" fill="#c0392b"/>
    <text x="98" y="337" font-size="19" font-weight="700" fill="#c85a1c">三月　4/17~5/16</text><text x="98" y="362" font-size="16" fill="#2b2320">動能弱，量縮盤跌</text><text x="553" y="353" font-size="38" font-weight="700" fill="#c0392b" text-anchor="middle">↓</text>

    <rect x="70" y="382" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="70" y="382" width="8" height="66" rx="4" fill="#c0392b"/>
    <text x="98" y="411" font-size="19" font-weight="700" fill="#c85a1c">四月　5/17~6/14</text><text x="98" y="436" font-size="16" fill="#2b2320">突發利空，防急殺</text><text x="553" y="427" font-size="38" font-weight="700" fill="#c0392b" text-anchor="middle">↓</text>

    <rect x="70" y="456" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="70" y="456" width="8" height="66" rx="4" fill="#d98a2b"/>
    <text x="98" y="485" font-size="19" font-weight="700" fill="#c85a1c">五月　6/15~7/13</text><text x="98" y="510" font-size="16" fill="#2b2320">全年變盤，趕底或 V 轉</text><text x="553" y="501" font-size="38" font-weight="700" fill="#d98a2b" text-anchor="middle">↕</text>

    <rect x="70" y="530" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="70" y="530" width="8" height="66" rx="4" fill="#4f9d5b"/>
    <text x="98" y="559" font-size="19" font-weight="700" fill="#c85a1c">六月　7/14~8/12</text><text x="98" y="584" font-size="16" fill="#2b2320">機構買盤，觸底反轉</text><text x="553" y="575" font-size="38" font-weight="700" fill="#4f9d5b" text-anchor="middle">↑</text>
  </g>

  <!-- RIGHT -->
  <g>
    <rect x="605" y="160" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="605" y="160" width="8" height="66" rx="4" fill="#4f9d5b"/>
    <text x="633" y="189" font-size="19" font-weight="700" fill="#c85a1c">七月　8/13~9/10</text><text x="633" y="214" font-size="16" fill="#2b2320">緩步墊高，盤整向上</text><text x="1088" y="205" font-size="38" font-weight="700" fill="#4f9d5b" text-anchor="middle">↑</text>

    <rect x="605" y="234" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="605" y="234" width="8" height="66" rx="4" fill="#4f9d5b"/>
    <text x="633" y="263" font-size="19" font-weight="700" fill="#c85a1c">八月　9/11~10/10</text><text x="633" y="288" font-size="16" fill="#2b2320">庫星逢火，偏多急拉</text><text x="1088" y="279" font-size="38" font-weight="700" fill="#4f9d5b" text-anchor="middle">↑</text>

    <rect x="605" y="308" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="605" y="308" width="8" height="66" rx="4" fill="#d98a2b"/>
    <text x="633" y="337" font-size="19" font-weight="700" fill="#c85a1c">九月　10/11~11/8</text><text x="633" y="362" font-size="16" fill="#2b2320">高檔震盪，漲勢放緩</text><text x="1088" y="353" font-size="38" font-weight="700" fill="#d98a2b" text-anchor="middle">↕</text>

    <rect x="605" y="382" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="605" y="382" width="8" height="66" rx="4" fill="#d98a2b"/>
    <text x="633" y="411" font-size="19" font-weight="700" fill="#c85a1c">十月　11/9~12/8</text><text x="633" y="436" font-size="16" fill="#2b2320">過熱後急殺，大起大落</text><text x="1088" y="427" font-size="38" font-weight="700" fill="#d98a2b" text-anchor="middle">↕</text>

    <rect x="605" y="456" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="605" y="456" width="8" height="66" rx="4" fill="#c0392b"/>
    <text x="633" y="485" font-size="19" font-weight="700" fill="#c85a1c">十一月　12/9~1/7</text><text x="633" y="510" font-size="16" fill="#2b2320">監管引爆，最凶防破底</text><text x="1088" y="501" font-size="38" font-weight="700" fill="#c0392b" text-anchor="middle">↓</text>

    <rect x="605" y="530" width="525" height="66" rx="12" fill="#fff" stroke="#ecdcc9" stroke-width="1.5"/><rect x="605" y="530" width="8" height="66" rx="4" fill="#8a7a6d"/>
    <text x="633" y="559" font-size="19" font-weight="700" fill="#c85a1c">十二月　1/8~2/5</text><text x="633" y="584" font-size="16" fill="#2b2320">止穩修復，平和收尾</text><text x="1088" y="575" font-size="38" font-weight="700" fill="#8a7a6d" text-anchor="middle">→</text>
  </g>

  <text x="70" y="648" font-size="15" fill="#a89a8d">小狐狸區塊鏈  ·  命理趣味推演，非價格預測，切勿作為交易依據</text>
</svg>
