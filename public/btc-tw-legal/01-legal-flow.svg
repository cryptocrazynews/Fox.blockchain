<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8f1"/>
      <stop offset="1" stop-color="#fdeede"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="80" y="86" font-size="46" font-weight="700" fill="#2b2320">在台灣買比特幣，合法嗎？</text>
  <text x="80" y="128" font-size="23" fill="#8a7a6d">重點不是「能不能買」，而是「你透過誰買」</text>

  <!-- start -->
  <rect x="440" y="168" width="320" height="70" rx="35" fill="#e8722a"/>
  <text x="600" y="212" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">你想買比特幣</text>

  <!-- connector -->
  <rect x="596" y="238" width="8" height="46" fill="#e8a76a"/>
  <text x="600" y="316" font-size="26" font-weight="700" fill="#2b2320" text-anchor="middle">你透過哪種平台買？</text>

  <!-- split lines -->
  <rect x="300" y="340" width="600" height="8" fill="#e8a76a"/>
  <rect x="300" y="340" width="8" height="40" fill="#e8a76a"/>
  <rect x="892" y="340" width="8" height="40" fill="#e8a76a"/>

  <!-- left branch: legal -->
  <rect x="90" y="384" width="430" height="210" rx="18" fill="#ffffff" stroke="#6fae5f" stroke-width="3"/>
  <text x="305" y="430" font-size="26" font-weight="700" fill="#3f7d33" text-anchor="middle">已完成洗錢防制登記的業者</text>
  <text x="120" y="478" font-size="21" fill="#2b2320">✔  完全合法，個人不需任何執照</text>
  <text x="120" y="518" font-size="21" fill="#2b2320">✔  資產保管與爭議處理有規範</text>
  <text x="120" y="558" font-size="21" fill="#2b2320">✔  台幣出入金走本土通道最安心</text>
  <text x="305" y="588" font-size="18" fill="#3f7d33" text-anchor="middle" font-weight="700">目前共 8 家</text>

  <!-- right branch: risky -->
  <rect x="680" y="384" width="430" height="210" rx="18" fill="#fff3e8" stroke="#d9743f" stroke-width="3"/>
  <text x="895" y="430" font-size="26" font-weight="700" fill="#b0451a" text-anchor="middle">沒登記 / 保證獲利 / 代操平台</text>
  <text x="710" y="478" font-size="21" fill="#2b2320">✘  用戶不會因此觸法</text>
  <text x="710" y="518" font-size="21" fill="#2b2320">✘  但求助無門、資產難追討</text>
  <text x="710" y="558" font-size="21" fill="#2b2320">✘  詐騙與帳戶凍結風險最高</text>
  <text x="895" y="588" font-size="18" fill="#b0451a" text-anchor="middle" font-weight="700">離它遠一點</text>

  <text x="80" y="648" font-size="16" fill="#a89a8d">小狐狸區塊鏈  ·  法律管的是業者要拿牌照，不是禁止你買幣</text>
</svg>
