<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a35e"/>
      <stop offset="1" stop-color="#c85a1c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#fff8f1"/>
  <text x="80" y="84" font-size="44" font-weight="700" fill="#2b2320">從登記制到許可制：對業者更嚴，對你更好</text>
  <text x="80" y="124" font-size="22" fill="#8a7a6d">制度拉高門檻，留下來的每一家都更禁得起檢視</text>

  <!-- timeline -->
  <rect x="140" y="330" width="920" height="10" rx="5" fill="url(#ln)"/>

  <!-- node A: now -->
  <circle cx="230" cy="335" r="16" fill="#e8722a" stroke="#fff" stroke-width="4"/>
  <rect x="110" y="180" width="260" height="120" rx="14" fill="#ffffff" stroke="#f2c9a3" stroke-width="2"/>
  <text x="240" y="220" font-size="24" font-weight="700" fill="#e8722a" text-anchor="middle">現在 · 登記制</text>
  <text x="240" y="255" font-size="18" fill="#2b2320" text-anchor="middle">完成洗錢防制登記</text>
  <text x="240" y="282" font-size="18" fill="#2b2320" text-anchor="middle">就能合法營業</text>

  <!-- node B: passed -->
  <circle cx="530" cy="335" r="16" fill="#e8722a" stroke="#fff" stroke-width="4"/>
  <rect x="410" y="370" width="260" height="120" rx="14" fill="#ffffff" stroke="#f2c9a3" stroke-width="2"/>
  <text x="540" y="410" font-size="24" font-weight="700" fill="#e8722a" text-anchor="middle">2026 / 6 / 30</text>
  <text x="540" y="445" font-size="18" fill="#2b2320" text-anchor="middle">虛擬資產服務法三讀</text>
  <text x="540" y="472" font-size="18" fill="#8a7a6d" text-anchor="middle">通過，但還沒生效</text>

  <!-- node C: effective -->
  <circle cx="830" cy="335" r="16" fill="#e8722a" stroke="#fff" stroke-width="4"/>
  <rect x="710" y="180" width="270" height="120" rx="14" fill="#ffffff" stroke="#f2c9a3" stroke-width="2"/>
  <text x="845" y="220" font-size="24" font-weight="700" fill="#e8722a" text-anchor="middle">最快 2027 Q1</text>
  <text x="845" y="255" font-size="18" fill="#2b2320" text-anchor="middle">許可制正式施行</text>
  <text x="845" y="282" font-size="18" fill="#8a7a6d" text-anchor="middle">先審財務內控才發牌</text>

  <!-- node D: transition -->
  <circle cx="1010" cy="335" r="16" fill="#c85a1c" stroke="#fff" stroke-width="4"/>
  <rect x="890" y="370" width="270" height="120" rx="14" fill="#fff3e8" stroke="#e8a76a" stroke-width="2"/>
  <text x="1025" y="410" font-size="22" font-weight="700" fill="#c85a1c" text-anchor="middle">既有 8 家過渡期</text>
  <text x="1025" y="445" font-size="17" fill="#2b2320" text-anchor="middle">期限內申請並取得證照</text>
  <text x="1025" y="472" font-size="17" fill="#2b2320" text-anchor="middle">沒跟上視同無照經營</text>

  <!-- penalty note -->
  <rect x="140" y="540" width="920" height="70" rx="14" fill="#fbe6dc" stroke="#d9743f" stroke-width="2"/>
  <text x="170" y="583" font-size="21" fill="#2b2320">罰的都是「業者」不是你：無照經營最重關 7 年、併科最高 1 億，涉詐欺或操縱市場更重。</text>

  <text x="80" y="650" font-size="16" fill="#a89a8d">小狐狸區塊鏈  ·  時程以立法院條文與金管會後續公告為準</text>
</svg>
