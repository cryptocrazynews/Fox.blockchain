<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,'Noto Sans TC',sans-serif">
  <defs>
    <style>
      .lbl{fill:#fff;font-weight:700}
      .sub{fill:rgba(255,255,255,.92);font-weight:500}
      .step{fill:#8A93A6;font-weight:700;letter-spacing:.08em}
      .time{fill:#F5A524;font-weight:800}
      .timecap{fill:#9AA3B2;font-weight:600}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9AA3B2"/>
    </marker>
  </defs>

  <!-- Step 1: 海外交易所 -->
  <text x="170" y="70" class="step" font-size="20" text-anchor="middle">STEP 1</text>
  <rect x="40" y="90" width="260" height="150" rx="20" fill="#1B4DFF"/>
  <text x="170" y="150" class="lbl" font-size="30" text-anchor="middle">海外交易所</text>
  <text x="170" y="190" class="sub" font-size="19" text-anchor="middle">幣安 / OKX / Bybit…</text>
  <text x="170" y="218" class="sub" font-size="17" text-anchor="middle">把幣轉到台灣交易所</text>

  <!-- arrow 1 -->
  <line x1="310" y1="165" x2="430" y2="165" stroke="#9AA3B2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="370" y="140" class="time" font-size="20" text-anchor="middle">5–30 分</text>
  <text x="370" y="200" class="timecap" font-size="15" text-anchor="middle">區塊鏈轉帳</text>

  <!-- Step 2: 台灣交易所 -->
  <text x="600" y="70" class="step" font-size="20" text-anchor="middle">STEP 2</text>
  <rect x="470" y="90" width="260" height="150" rx="20" fill="#F5A524"/>
  <text x="600" y="150" fill="#231600" font-size="30" font-weight="700" text-anchor="middle">台灣交易所</text>
  <text x="600" y="190" fill="#3a2a05" font-size="19" font-weight="600" text-anchor="middle">MAX / BitoPro</text>
  <text x="600" y="218" fill="#3a2a05" font-size="17" font-weight="600" text-anchor="middle">USDT 賣成新台幣</text>

  <!-- arrow 2 -->
  <line x1="740" y1="165" x2="860" y2="165" stroke="#9AA3B2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="140" class="time" font-size="20" text-anchor="middle">幾乎即時</text>
  <text x="800" y="200" class="timecap" font-size="15" text-anchor="middle">掛單成交</text>

  <!-- Step 3: 銀行 -->
  <text x="1030" y="70" class="step" font-size="20" text-anchor="middle">STEP 3</text>
  <rect x="900" y="90" width="260" height="150" rx="20" fill="#15a06b"/>
  <text x="1030" y="150" class="lbl" font-size="30" text-anchor="middle">台灣銀行</text>
  <text x="1030" y="190" class="sub" font-size="19" text-anchor="middle">你的銀行帳戶</text>
  <text x="1030" y="218" class="sub" font-size="17" text-anchor="middle">提領台幣、入帳</text>

  <!-- bottom total -->
  <rect x="40" y="300" width="1120" height="120" rx="20" fill="rgba(27,77,255,.08)" stroke="rgba(27,77,255,.25)"/>
  <text x="600" y="345" fill="#1B4DFF" font-size="20" font-weight="800" text-anchor="middle">整段實測總時間</text>
  <text x="600" y="392" fill="#1B4DFF" font-size="34" font-weight="800" text-anchor="middle">最快約 30 分鐘　•　一般 1～3 個工作天（遇假日／大額審核更久）</text>
</svg>
