    <rect x="60" y="574" width="1080" height="52" fill="#fdece0"/>
    <text x="90" y="608">跨鏈科技</text><text x="470" y="608" font-weight="700" fill="#c85a1c">跨鏈科技</text><text x="850" y="608" font-size="19">公會理事業者</text>
  </g>

  <text x="60" y="656" font-size="16" fill="#a89a8d">小狐狸區塊鏈  ·  名單以金管會證期局與虛擬通貨公會最新公告為準，家數會變動</text>
</svg>
