    <rect x="60" y="412" width="1080" height="52" fill="#fff3e8"/>
    <text x="90" y="446">重量科技</text><text x="470" y="446" font-weight="700" fill="#c85a1c">KryptoGO</text><text x="850" y="446" font-size="19">錢包與合規科技</text>

