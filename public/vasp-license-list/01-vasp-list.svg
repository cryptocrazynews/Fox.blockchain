<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1200" height="675" fill="#fbf6f0"/>
  <text x="60" y="78" font-size="42" font-weight="700" fill="#2b2320">台灣 8 家完成洗錢防制登記的 VASP</text>
  <text x="60" y="116" font-size="21" fill="#8a7a6d">金管會公告「公司名」，你聽到的是「品牌」，這裡並排給你看</text>

  <!-- table header -->
  <rect x="60" y="140" width="1080" height="52" rx="10" fill="#e8722a"/>
  <text x="90" y="175" font-size="22" font-weight="700" fill="#fff8f1">公司名</text>
  <text x="470" y="175" font-size="22" font-weight="700" fill="#fff8f1">對應交易所／品牌</text>
  <text x="850" y="175" font-size="22" font-weight="700" fill="#fff8f1">定位</text>

  <!-- rows -->
  <g font-size="21" fill="#2b2320">
    <rect x="60" y="196" width="1080" height="52" fill="#fff3e8"/>
    <text x="90" y="230">現代財富科技</text><text x="470" y="230" font-weight="700" fill="#c85a1c">MaiCoin／MAX</text><text x="850" y="230" font-size="19">台灣最大，台幣信託</text>

    <rect x="60" y="250" width="1080" height="52" fill="#fdece0"/>
    <text x="90" y="284">幣託科技</text><text x="470" y="284" font-weight="700" fill="#c85a1c">BitoPro</text><text x="850" y="284" font-size="19">老牌，超商買幣起家</text>

    <rect x="60" y="304" width="1080" height="52" fill="#fff3e8"/>
    <text x="90" y="338">鏈科</text><text x="470" y="338" font-weight="700" fill="#c85a1c">XREX</text><text x="850" y="338" font-size="19">美元出入金、跨境支付</text>

    <rect x="60" y="358" width="1080" height="52" fill="#fdece0"/>
