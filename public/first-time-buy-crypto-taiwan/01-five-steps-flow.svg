<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1200" height="675" fill="#fbf6f0"/>
  <rect x="0" y="0" width="1200" height="10" fill="#e8722a"/>
  <text x="60" y="80" font-size="44" font-weight="700" fill="#2b2320">第一次買加密貨幣：五個步驟走完</text>
  <text x="60" y="122" font-size="24" fill="#8a7a6d">台灣新手從開戶到買幣，一步一步照著做</text>

  <!-- Steps -->
  <g>
    <!-- Step 1 -->
    <rect x="60" y="170" width="1080" height="78" rx="14" fill="#fff8f1" stroke="#e8722a" stroke-width="2"/>
    <circle cx="112" cy="209" r="30" fill="#e8722a"/>
    <text x="112" y="221" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="168" y="200" font-size="28" font-weight="700" fill="#2b2320">挑一家合規交易所</text>
    <text x="168" y="234" font-size="21" fill="#8a7a6d">認明金管會已登記名單，台幣入出金順、介面看得懂</text>

    <!-- Step 2 -->
    <rect x="60" y="262" width="1080" height="78" rx="14" fill="#fff8f1" stroke="#e8722a" stroke-width="2"/>
    <circle cx="112" cy="301" r="30" fill="#e8722a"/>
    <text x="112" y="313" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="168" y="292" font-size="28" font-weight="700" fill="#2b2320">完成實名驗證 KYC</text>
    <text x="168" y="326" font-size="21" fill="#8a7a6d">身分證＋第二證件＋人臉辨識，綁定本人銀行帳戶</text>

    <!-- Step 3 -->
    <rect x="60" y="354" width="1080" height="78" rx="14" fill="#fff8f1" stroke="#e8722a" stroke-width="2"/>
    <circle cx="112" cy="393" r="30" fill="#e8722a"/>
    <text x="112" y="405" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="168" y="384" font-size="28" font-weight="700" fill="#2b2320">用台幣入金</text>
    <text x="168" y="418" font-size="21" fill="#8a7a6d">從本人銀行帳戶匯款，備註碼別打錯，最低百元起</text>

    <!-- Step 4 -->
    <rect x="60" y="446" width="1080" height="78" rx="14" fill="#fff8f1" stroke="#e8722a" stroke-width="2"/>
    <circle cx="112" cy="485" r="30" fill="#e8722a"/>
    <text x="112" y="497" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="168" y="476" font-size="28" font-weight="700" fill="#2b2320">選幣、市價下單</text>
    <text x="168" y="510" font-size="21" fill="#8a7a6d">從 BTC、ETH 開始，輸入金額即可買到第一筆</text>

    <!-- Step 5 -->
    <rect x="60" y="538" width="1080" height="78" rx="14" fill="#fff8f1" stroke="#c85a1c" stroke-width="2"/>
    <circle cx="112" cy="577" r="30" fill="#c85a1c"/>
    <text x="112" y="589" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="168" y="568" font-size="28" font-weight="700" fill="#2b2320">想清楚幣放哪、做好防護</text>
    <text x="168" y="602" font-size="21" fill="#8a7a6d">開啟雙重驗證 2FA，長期大額再學提到自己的錢包</text>
  </g>

  <text x="1140" y="655" font-size="20" fill="#8a7a6d" text-anchor="end">小狐狸區塊鏈</text>
</svg>
