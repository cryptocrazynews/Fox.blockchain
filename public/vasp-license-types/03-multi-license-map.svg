<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1200" height="675" fill="#fbf6f0"/>
  <text x="60" y="80" font-size="44" font-weight="700" fill="#2b2320">一種業務一張牌，做越多拿越多</text>
  <text x="60" y="118" font-size="21" fill="#8a7a6d">第 7 條：每一類都要分別申請，牌照數量等於責任範圍</text>

  <!-- central node -->
  <rect x="440" y="270" width="320" height="130" rx="20" fill="#e8722a"/>
  <text x="600" y="326" font-size="27" font-weight="700" fill="#fff8f1" text-anchor="middle">一家典型</text>
  <text x="600" y="366" font-size="27" font-weight="700" fill="#fff8f1" text-anchor="middle">台灣交易所</text>

  <!-- three branch cards -->
  <!-- 交換 -->
  <line x1="440" y1="320" x2="300" y2="210" stroke="#c85a1c" stroke-width="3"/>
  <rect x="70" y="150" width="300" height="120" rx="16" fill="#fff3e8" stroke="#e8a76a" stroke-width="2"/>
  <text x="94" y="196" font-size="24" font-weight="700" fill="#c85a1c">交換商牌</text>
  <text x="94" y="234" font-size="18" fill="#2b2320">讓你用台幣換 USDT</text>

  <!-- 交易平台 -->
  <line x1="600" y1="270" x2="600" y2="170" stroke="#c85a1c" stroke-width="3"/>
  <rect x="830" y="150" width="300" height="120" rx="16" fill="#fff3e8" stroke="#e8a76a" stroke-width="2"/>
  <text x="854" y="196" font-size="24" font-weight="700" fill="#c85a1c">交易平台商牌</text>
  <text x="854" y="234" font-size="18" fill="#2b2320">掛單簿撮合買賣</text>

  <!-- 保管 -->
  <line x1="600" y1="400" x2="600" y2="470" stroke="#c85a1c" stroke-width="3"/>
  <rect x="450" y="470" width="300" height="120" rx="16" fill="#fbe6dc" stroke="#d9743f" stroke-width="2"/>
  <text x="474" y="516" font-size="24" font-weight="700" fill="#b0451a">保管商牌</text>
  <text x="474" y="554" font-size="18" fill="#2b2320">幫你保管平台上的幣</text>

  <text x="70" y="330" font-size="20" fill="#5c5045">光這三件事</text>
  <text x="70" y="362" font-size="20" fill="#5c5045">就要三張牌</text>

  <text x="830" y="516" font-size="19" fill="#8a7a6d">沒有保管牌卻</text>
  <text x="830" y="544" font-size="19" fill="#8a7a6d">幫你保管資產？</text>
  <text x="830" y="572" font-size="19" font-weight="700" fill="#b0451a">那就是一面紅旗</text>

  <text x="60" y="648" font-size="16" fill="#a89a8d">小狐狸區塊鏈  ·  依《虛擬資產服務法》第 7 條，2026/6/30 三讀通過</text>
</svg>
