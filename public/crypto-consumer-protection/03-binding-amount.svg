<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="1200" height="675" fill="#fbf6f0"/>
  <text x="80" y="84" font-size="46" font-weight="700" fill="#2b2320">評議「一定額度」：業者跑不掉</text>
  <text x="80" y="122" font-size="22" fill="#8a7a6d">額度內、業者事前書面同意者，必須接受評議結果</text>

  <!-- card A 非投資型 -->
  <rect x="80" y="175" width="500" height="290" rx="20" fill="#fff3e8" stroke="#e8a76a" stroke-width="2"/>
  <text x="110" y="235" font-size="30" font-weight="700" fill="#c85a1c">非投資型爭議</text>
  <text x="110" y="272" font-size="19" fill="#8a7a6d">一般金融商品或服務糾紛</text>
  <line x1="110" y1="296" x2="550" y2="296" stroke="#e8c3a0" stroke-width="1.5"/>
  <text x="110" y="352" font-size="22" fill="#2b2320">此金額以內業者須認帳</text>
  <text x="110" y="418" font-size="72" font-weight="700" fill="#e8722a">12 萬元</text>

  <!-- card B 投資型 -->
  <rect x="620" y="175" width="500" height="290" rx="20" fill="#fbe6dc" stroke="#d9743f" stroke-width="2"/>
  <text x="650" y="235" font-size="30" font-weight="700" fill="#b0451a">投資型商品或服務</text>
  <text x="650" y="272" font-size="19" fill="#8a7a6d">具投資性質的商品爭議</text>
  <line x1="650" y1="296" x2="1090" y2="296" stroke="#e6b9a3" stroke-width="1.5"/>
  <text x="650" y="352" font-size="22" fill="#2b2320">此金額以內業者須認帳</text>
  <text x="650" y="418" font-size="72" font-weight="700" fill="#c03d12">120 萬元</text>

  <!-- footer note -->
  <rect x="80" y="500" width="1040" height="110" rx="16" fill="#fff8f1" stroke="#e8c3a0" stroke-width="1.5"/>
  <text x="110" y="546" font-size="21" fill="#2b2320">超過額度：你願意減額到額度內，業者一樣受拘束。</text>
  <text x="110" y="584" font-size="21" fill="#2b2320">超過額度又不減額：評議結果對業者才沒強制力，這時才需考慮走法院。</text>

  <text x="1000" y="658" font-size="18" fill="#8a7a6d">小狐狸區塊鏈</text>
</svg>
